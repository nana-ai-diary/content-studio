<body><div id="root"><main><h1>内容工坊</h1><p>无需登录，管理小红书、抖音与 X 的内容流程：业务配置、热点与对标材料导入、选题库、三平台独立草稿、图文制作、视频分镜、审核排期、发布记录和效果复盘。</p><p>支持导出文案、PNG图文ZIP包和无配音WebM视频，内容保存在当前浏览器。支持Excel与截图复盘、对标博主研究。默认外部AI导回，自带API可选；自动采集与平台直发尚未接通。</p><a href="./guide.html">查看完整功能说明</a><noscript>请启用 JavaScript 使用工作台。功能说明页无需 JavaScript 即可阅读。</noscript></main></div></body></html>
